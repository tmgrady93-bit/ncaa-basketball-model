name: Update Odds Data

on:
  schedule:
    - cron: "0 * * * *"  # Runs every hour on the hour (UTC)
  workflow_dispatch:      # Lets you trigger a manual run from the Actions tab

permissions:
  contents: write         # Allows the workflow to commit the updated CSV

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Fetch latest odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_odds.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add latest_odds.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update odds data" && git push)
