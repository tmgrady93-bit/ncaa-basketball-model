name: Refresh model training data

on:
  workflow_dispatch:
  schedule:
    # 7 AM America/Chicago, including both UTC offsets for DST.
    - cron: "0 12,13 * * *"

permissions:
  contents: write

jobs:
  refresh-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check local schedule
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            run=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(str(datetime.now(ZoneInfo('America/Chicago')).hour == 7).lower())")
            echo "run=$run" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.schedule.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.schedule.outputs.run == 'true'
        with:
          python-version: "3.13"

      - name: Install model dependencies
        if: steps.schedule.outputs.run == 'true'
        run: |
          python -m pip install \
            "numpy>=2,<3" \
            "pandas>=2.2,<3" \
            "pyarrow>=18,<21" \
            "requests>=2.31,<3" \
            "scikit-learn>=1.4,<2"

      - name: Refresh SportsDataverse model data
        if: steps.schedule.outputs.run == 'true'
        run: |
          python scripts/refresh_model_data.py \
            --data-root data/mbb \
            --schedule data/schedule_2027_upcoming.csv \
            --output data/2027_upcoming_predictions.csv

      - name: Refresh DraftKings comparisons
        if: steps.schedule.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python odds_data.py \
            --predictions data/2027_upcoming_predictions.csv \
            --yesterday-predictions data/yesterday_model_predictions.csv \
            --output-dir data

      - name: Commit regenerated projections
        if: steps.schedule.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/2027_upcoming_predictions.csv \
            data/2027_upcoming_with_benchmarks.csv \
            data/draftkings_ncaab_odds.csv \
            data/yesterday_model_predictions.csv \
            data/yesterday_model_scorecard.csv
          if git diff --cached --quiet; then
            echo "No model refresh changes to commit."
            exit 0
          fi
          git commit -m "Refresh SportsDataverse model projections"
          git push
