name: Refresh DraftKings odds

on:
  workflow_dispatch:
  schedule:
    # 8 AM, 10 AM, 1 PM, and 5 PM America/Chicago. Both UTC offsets are
    # included because GitHub cron uses UTC and the guard handles DST.
    - cron: "0 13,14 * * *"
    - cron: "0 15,16 * * *"
    - cron: "0 18,19 * * *"
    - cron: "0 22,23 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check local schedule
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            run=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(str(datetime.now(ZoneInfo('America/Chicago')).hour in {8, 10, 13, 17}).lower())")
            echo "run=$run" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install odds dependencies
        if: steps.schedule.outputs.run == 'true'
        run: python -m pip install "pandas>=2.2,<3" "requests>=2.31,<3"

      - name: Refresh DraftKings benchmarks
        if: steps.schedule.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python odds_data.py \
            --predictions data/2027_upcoming_predictions.csv \
            --yesterday-predictions data/yesterday_model_predictions.csv \
            --output-dir data

      - name: Commit refreshed benchmark files
        if: steps.schedule.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/2027_upcoming_with_benchmarks.csv \
            data/draftkings_ncaab_odds.csv \
            data/yesterday_model_predictions.csv \
            data/yesterday_model_scorecard.csv
          if git diff --cached --quiet; then
            echo "No benchmark changes to commit."
            exit 0
          fi
          git commit -m "Refresh DraftKings benchmark odds"
          git push
